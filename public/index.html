<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kundenantrag - Schlagverwaltung</title>
    <!-- Leaflet & Leaflet.draw CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app" class="container">
        <h1>Kundenantrag - Schlagverwaltung</h1>

        <div id="step-indicators" class="steps">
            <span id="step-1-indicator" class="step active">1. Persönliche Daten</span>
            <span id="step-2-indicator" class="step">2. Schläge & Karte</span>
        </div>

        <!-- Step 1: Personal Data -->
        <div id="step-1" class="step-container">
            <h2>Persönliche Daten</h2>
            <form id="customer-form">
                <div class="form-row">
                    <div class="form-group">
                        <label for="first_name">Vorname:</label>
                        <input type="text" id="first_name" name="first_name">
                    </div>
                    <div class="form-group">
                        <label for="name">Nachname:</label>
                        <input type="text" id="name" name="name" required>
                    </div>
                    <div class="form-group">
                        <label for="company">Firma:</label>
                        <input type="text" id="company" name="company">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group flex-3">
                        <label for="street">Straße:</label>
                        <input type="text" id="street" name="street">
                    </div>
                    <div class="form-group flex-1">
                        <label for="house_number">Nr.:</label>
                        <input type="text" id="house_number" name="house_number">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group flex-1">
                        <label for="postal_code">PLZ:</label>
                        <input type="text" id="postal_code" name="postal_code">
                    </div>
                    <div class="form-group flex-3">
                        <label for="city">Ort:</label>
                        <input type="text" id="city" name="city">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="email">E-Mail:</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="phone">Telefon:</label>
                        <input type="tel" id="phone" name="phone">
                    </div>
                </div>
                <div class="form-group">
                    <label for="comments">Anmerkungen:</label>
                    <textarea id="comments" name="comments" rows="3"></textarea>
                </div>
                <div class="form-group checkbox-group">
                    <input type="checkbox" id="dsgvo" name="dsgvo" required>
                    <label for="dsgvo">Ich akzeptiere die <a href="#" target="_blank">Datenschutzbestimmungen (DSGVO)</a>.</label>
                </div>
                <button type="button" id="btn-next-step" class="btn">Nächster Schritt</button>
            </form>
        </div>

        <!-- Step 2: Field Management -->
        <div id="step-2" class="step-container hidden">
            <div class="map-layout">
                <div class="sidebar">
                    <h3>Schlagverwaltung</h3>
                    <div class="search-tools">
                        <label for="search-postal-code">Karte zentrieren (PLZ):</label>
                        <div class="input-group">
                            <input type="text" id="search-postal-code" placeholder="z.B. 67245">
                            <button type="button" id="btn-search-plz" class="btn secondary small">Suche</button>
                        </div>
                    </div>
                    <div class="import-tools">
                        <label for="import-file">Schläge importieren (KML, SHP-Zip, SHP-Einzeldateien oder Digitale Schlagkartei):</label>
                        <input type="file" id="import-file" accept=".kml, .zip, .shp, .dbf, .shx, .prj, .xml" multiple>
                    </div>
                    <div id="field-list">
                        <!-- Fields list items will go here -->
                        <p>Noch keine Schläge hinzugefügt.</p>
                    </div>
                    <div class="actions">
                        <button id="btn-submit" class="btn success">Antrag absenden</button>
                        <button id="btn-prev-step" class="btn secondary">Zurück</button>
                    </div>
                </div>
                <div id="map"></div>
                <div id="flightplan-sidebar" class="sidebar right-sidebar hidden">
                    <span id="close-fp-sidebar" class="close-btn">&times;</span>
                    <h3>Flugplan</h3>
                    <form id="flightplan-form">
                        <input type="hidden" id="fp-field-id">

                        <div class="form-group slider-group">
                            <label for="fp-path-distance">Pfadabstand (m): <span id="val-fp-path-distance">10</span></label>
                            <input type="range" id="slider-fp-path-distance" min="1" max="50" step="0.5" value="10">
                            <input type="number" id="fp-path-distance" value="10" step="0.5">
                        </div>

                        <div class="form-group slider-group">
                            <label for="fp-border-distance">Randabstand (m): <span id="val-fp-border-distance">5</span></label>
                            <input type="range" id="slider-fp-border-distance" min="0" max="20" step="0.5" value="5">
                            <input type="number" id="fp-border-distance" value="5" step="0.5">
                        </div>

                        <div class="form-group slider-group">
                            <label for="fp-orientation">Ausrichtung (°): <span id="val-fp-orientation">Auto</span></label>
                            <input type="range" id="slider-fp-orientation" min="0" max="360" step="1" value="0">
                            <input type="number" id="fp-orientation" placeholder="Automatisch" min="0" max="360" step="1">
                        </div>

                        <div class="form-group slider-group">
                            <label for="fp-speed">Tempo (m/s): <span id="val-fp-speed">10</span></label>
                            <input type="range" id="slider-fp-speed" min="1" max="25" step="1" value="10">
                            <input type="number" id="fp-speed" value="10" step="1">
                        </div>

                        <div class="form-group slider-group">
                            <label for="fp-height">Flughöhe (m): <span id="val-fp-height">15</span></label>
                            <input type="range" id="slider-fp-height" min="1" max="120" step="1" value="15">
                            <input type="number" id="fp-height" value="15" step="1">
                        </div>

                        <div id="fp-stats" class="fp-stats hidden">
                            <p>Pfadlänge: <span id="fp-length">0</span> m</p>
                            <p>Geschätzte Dauer: <span id="fp-duration">0</span> min</p>
                        </div>

                        <div class="actions vertical">
                            <button type="button" id="btn-reverse-fp" class="btn secondary small hidden">Startpunkt drehen</button>
                            <button type="button" id="btn-generate-fp" class="btn success small">Generieren</button>
                            <button type="button" id="btn-export-fp-kml" class="btn secondary small hidden">KML Export</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <!-- External Libs -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/leaflet-geometryutil@0.10.3/src/leaflet.geometryutil.min.js"></script>
    <script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>
    <!-- For SHP Support -->
    <script src="https://unpkg.com/shpjs@latest/dist/shp.js"></script>
    <!-- For KML Support -->
    <script src="https://unpkg.com/leaflet-omnivore@0.3.4/leaflet-omnivore.min.js"></script>
    <!-- App Logic -->
    <script src="js/map.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
